[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voicewire"
version = "0.1.0"
description = "Evidence-driven diagnostics for voice AI systems."
readme = "README.md"
requires-python = ">=3.11"
# No license has been chosen yet. See LICENSE_STATUS.md — this is intentional,
# not an oversight, and must be resolved before any public release/package publish.
authors = [{ name = "VoiceWire contributors" }]
dependencies = [
    "typer>=0.12,<1.0",
    "pydantic>=2.6,<3.0",
]

[project.scripts]
voicewire = "voicewire.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voicewire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
